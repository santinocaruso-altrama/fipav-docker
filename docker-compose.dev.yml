# Overlay per lo sviluppo locale. Va usato SEMPRE insieme al compose base,
# mai da solo:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#

services:
  gateway:
    container_name: fipav-gateway-dev
    volumes:
      - ./docker/gateway/dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/gateway/dev/sites.conf:/etc/caddy/sites.conf:ro
      - ./docker/gateway/dev/backoffice.conf:/etc/caddy/backoffice.conf:ro

  php:
    container_name: fipav-php-dev
    build:
      context: ./docker/php/dev
    # host.docker.internal serve solo a Xdebug (xdebug.client_host, fisso
    # nell'immagine dev - vedi docker/php/dev/Dockerfile) per raggiungere
    # l'IDE sul Mac. In staging (niente Xdebug installato) non serve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-debug}"
      XDEBUG_CONFIG: client_host=host.docker.internal

  horizon:
    container_name: fipav-horizon-dev
    build:
      context: ./docker/php/dev
    # Un worker in background non serve mai un IDE in ascolto: a differenza
    # di `php` qui non c'e' override configurabile, resta sempre off.
    environment:
      XDEBUG_MODE: "off"

  backoffice:
    container_name: fipav-backoffice-dev
    build:
      context: ./docker/backoffice/dev
    volumes:
      - ../fipav-backoffice:/app
      - backoffice-node-modules:/app/node_modules
    expose:
      - "3000"

  comter:
    container_name: fipav-comter-dev
    build:
      context: ./docker/comter/dev
    volumes:
      - ../fipav-comter-frontend:/app
      - comter-node-modules:/app/node_modules

  mariadb:
    container_name: fipav-mariadb-dev
    volumes:
      - ./docker/mysql/dev/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro

  redis:
    container_name: fipav-redis-dev

  mailpit:
    container_name: fipav-mailpit-dev

  meilisearch:
    container_name: fipav-meilisearch-dev
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development

# Prima erano pinnati a fipav-core_* (per riusare il DB reale dello stack
# standalone di fipav-core): con il suffisso, deliberato, quel legame si
# rompe - vedi il commento su volumes in docker-compose.yml.
volumes:
  mariadb-data:
    name: fipav-core_mariadb-data-dev
  meilisearch-data:
    name: fipav-core_meilisearch-data-dev
  redis-data:
    name: fipav-core_redis-data-dev
  backoffice-node-modules:
    name: fipavonline_backoffice-node-modules-dev
  comter-node-modules:
    name: fipavonline_comter-node-modules-dev
  caddy-data:
    name: fipavonline_caddy-data-dev
  caddy-config:
    name: fipavonline_caddy-config-dev
