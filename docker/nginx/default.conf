# Accesso legacy a fipav-core su http://localhost:8080, con l'API su root.
#
# Esiste solo per compatibilita': i .env dei progetti puntano ancora a :8080
# (VITE_API_BASE_URL, API_BASE_URL) e le chiamate server-side di
# comter-frontend usano questo servizio via rete Docker.
#
# L'entrypoint di riferimento e' il gateway sulla porta 80, dove core risponde
# sotto /core/. Il blocco /backoffice/ che stava in questa configurazione e'
# stato rimosso: ora e' il gateway a servire il backoffice.
#
# Nota: questo nginx e il gateway servono lo stesso php-fpm con SCRIPT_NAME
# diversi. Qui non c'e' override, quindi Laravel calcola baseUrl vuoto e genera
# URL relativi a /, coerenti con questo entrypoint.

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Consente l'upload di file (media) fino a 25 MB.
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # I file media (storage/public) sono pubblici per design: consente al
    # backoffice (altra origine) di leggerne i pixel via canvas (es. editor di
    # crop/resize), cosa che un semplice <img> cross-origin senza questo header
    # non permette.
    location /storage/ {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}