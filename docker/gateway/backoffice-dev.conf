# Come il gateway serve /backoffice/ in SVILUPPO: proxy al dev server di Vite.
#
# Incluso dal Caddyfile via `import {$BACKOFFICE_HANDLER:...}`, che punta qui di
# default. Lo staging punta a backoffice-prod.conf. Vedi il Caddyfile.
#
# Il path arriva invariato, con il prefisso /backoffice: Vite e' configurato con
# base '/backoffice/' e si aspetta di vederlo. Spogliarlo qui romperebbe gli URL
# degli asset emessi dal dev server.
#
# reverse_proxy gestisce da se' l'upgrade a WebSocket, quindi l'HMR funziona
# senza configurazione.
reverse_proxy backoffice:3000
