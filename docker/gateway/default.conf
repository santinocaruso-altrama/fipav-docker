# Gateway unico dell'ecosistema FIPAV Online.
#
#   /            -> fipav-comter-frontend  (Next.js dev server)
#   /core/       -> fipav-core             (Laravel, via FastCGI)
#   /backoffice/ -> fipav-backoffice       (Vite dev server)

# Upgrade WebSocket solo quando il client lo chiede: passare
# "Connection: upgrade" su ogni richiesta romperebbe il keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;

    # Host volutamente non vincolato: localhost, *.localhost e in futuro
    # *.fipav.altrama.it. Il valore viene propagato inalterato agli upstream,
    # cosi' il routing multi-tenant per sottodominio di comter-frontend
    # (src/proxy.ts -> header x-tenant) continua a funzionare.
    server_name _;

    charset utf-8;

    # Allineato al limite del nginx di fipav-core: upload di media fino a 25 MB.
    client_max_body_size 25M;

    # ─── /backoffice -> Vite dev server ──────────────────────────────

    location = /backoffice {
        return 301 /backoffice/;
    }

    # Vite e' configurato con base '/backoffice/', quindi il path va inoltrato
    # invariato: proxy_pass senza URI dopo l'host. Aggiungere un path qui
    # (es. .../backoffice) farebbe concatenare i segmenti e romperebbe gli asset.
    location ^~ /backoffice/ {
        proxy_pass http://backoffice:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR di Vite.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ─── /core -> Laravel via FastCGI ────────────────────────────────

    location = /core {
        return 301 /core/;
    }

    # I media di storage/public sono pubblici per design: l'header CORS consente
    # al backoffice di leggerne i pixel via canvas (editor di crop/resize), cosa
    # che un <img> cross-origin senza questo header non permetterebbe.
    # Prefisso piu' lungo di /core/, quindi vince su di esso.
    location ^~ /core/storage/ {
        root /var/www/html/public;
        rewrite ^/core/(.*)$ /$1 break;

        add_header Access-Control-Allow-Origin * always;

        try_files $uri @core;

        # storage/ contiene file caricati dagli utenti: un .php finito qui non
        # deve poter essere ne' eseguito ne' letto in chiaro.
        location ~ \.php$ {
            return 404;
        }
    }

    # Static presenti in public/ serviti direttamente dal disco, tutto il resto
    # a PHP. Il rewrite tocca solo $uri (usato da try_files per cercare i file):
    # $request_uri resta intatto, quindi @core passa a PHP il path col prefisso.
    location ^~ /core/ {
        root /var/www/html/public;
        rewrite ^/core/(.*)$ /$1 break;

        try_files $uri @core;

        # Senza questa guardia try_files troverebbe public/index.php su disco e
        # lo servirebbe come file statico, esponendo il sorgente PHP. L'unico
        # entrypoint PHP legittimo e' @core.
        location ~ \.php$ {
            return 404;
        }

        # Dotfile (.env, .git, ...) non raggiungibili, eccetto .well-known.
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Entrypoint FastCGI dell'applicazione montata sotto /core.
    #
    # SCRIPT_NAME=/core/index.php e' il punto chiave di tutta questa
    # configurazione. Da quel valore Symfony ricava baseUrl=/core e
    # pathInfo=/api/v1/... : le route continuano quindi a fare match sui path
    # senza prefisso, mentre url(), route(), asset() e Storage::url() generano
    # gia' URL con /core davanti. Senza l'override, Laravel produrrebbe link
    # verso / e Swagger UI, redirect e URL dei media si romperebbero.
    #
    # SCRIPT_FILENAME e DOCUMENT_ROOT sono i path visti dal container php, che
    # monta ../fipav-core/src sullo stesso /var/www/html usato qui.
    location @core {
        fastcgi_pass php:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /core/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        # Import massivi e generazione della spec OpenAPI possono superare
        # i 60s di default.
        fastcgi_read_timeout 300;
    }

    # ─── / -> Next.js dev server ─────────────────────────────────────

    location / {
        proxy_pass http://comter:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR di Next.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}