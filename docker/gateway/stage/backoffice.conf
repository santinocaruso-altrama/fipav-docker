# Come il gateway serve /backoffice/ in STAGING: file statici, nessun dev server.
#
# Incluso direttamente da docker/gateway/stage/Caddyfile (docker/gateway/dev/
# usa il proprio backoffice.conf - due cartelle separate, non piu' una
# variabile che sceglie fra i due).
#
# La build di Vite (`vite build`) finisce DENTRO l'immagine (Dockerfile.stage,
# multi-stage), che poi la copia in un volume condiviso con il gateway
# (backoffice-dist, montato qui su /srv/backoffice). Il container del
# backoffice copia e termina: in staging non c'e' nessun processo Node in
# ascolto.
#
# Ricadute volute: sparisce il 403 di `server.allowedHosts` (era il dev server a
# emetterlo, e qui non c'e' piu'), non sono piu' esposti sorgenti e sourcemap, e
# le pagine non vengono ricompilate a ogni richiesta.

# I file nella build stanno senza il prefisso (assets/..., non
# backoffice/assets/...), mentre la richiesta arriva con /backoffice davanti:
# va tolto prima di cercarli su disco. In sviluppo invece il prefisso serve, ed
# e' l'unica differenza sostanziale fra i due snippet.
uri strip_prefix /backoffice

root * /srv/backoffice

# Gli asset con hash nel nome stanno tutti in assets/, e qui NON ci va il
# fallback della SPA: un .js mancante deve dare 404.
#
# Con il fallback attivo darebbe invece 200 con dentro l'index.html, e il
# browser fallirebbe con "Unexpected token '<'" mentre prova a eseguire
# dell'HTML come JavaScript. Un deploy incompleto sembrerebbe un bug del
# codice. Verificato: senza questa separazione un asset inesistente rispondeva
# 200.
handle /assets/* {
	file_server
}

# Tutto il resto: il documento e le rotte lato client (/backoffice/utenti, ...),
# che non esistono come file e senza fallback darebbero 404 al reload della
# pagina.
handle {
	try_files {path} /index.html
	file_server
}
