# Overlay per la macchina pubblica di staging. Va usato SEMPRE insieme al
# compose base, mai da solo:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# oppure `make up-staging`, che lo fa per te.
#
# Qui non c'e' nulla sui certificati: l'HTTPS lo gestisce Caddy da se', a partire
# dall'elenco di hostname in GATEWAY_SITES nel .env. Questo file serve a un'altra
# cosa: restringere uno stack nato per il locale, che monta i sorgenti dall'host
# e fa girare dei dev server, ora che e' raggiungibile da internet.
#
# Vedi docs/superpowers/specs/2026-07-29-https-letsencrypt-design.md

services:
  # Xdebug apre una connessione verso l'IDE a ogni richiesta: su una macchina
  # pubblica e' un costo per niente, e va anche a cercare host.docker.internal
  # che qui non porta da nessuna parte.
  php:
    environment:
      XDEBUG_MODE: "off"

  # ─── Frontend: build di produzione, non dev server ───────────────
  #
  # Perche' non bastava sbloccare gli host nei dev server: sia Vite
  # (server.allowedHosts) sia Next (allowedDevOrigins) validano l'Host in
  # sviluppo, e andrebbero aggiornati a ogni comitato nuovo. Con le build di
  # produzione quei controlli non esistono - sono funzioni dei soli dev server -
  # quindi aggiungere un comitato resta una riga in GATEWAY_SITES, come da
  # progetto. In piu' spariscono sorgenti e sourcemap esposti, e le pagine non
  # si ricompilano a ogni richiesta.
  #
  # NOTA: NODE_ENV resta `development` (dal Dockerfile) di proposito. Gli
  # entrypoint installano le dipendenze PRIMA di eseguire questi comandi, e
  # tutto cio' che serve alla build sta nelle devDependencies (vite,
  # typescript, tailwindcss): con NODE_ENV=production verrebbero saltate e la
  # build fallirebbe. `next build` e `vite build` impostano da se' la modalita'
  # produzione degli artefatti, che e' quello che conta.

  comter:
    # Build a ogni avvio, poi il server di produzione. `exec` perche' il segnale
    # di stop arrivi a next e non alla shell.
    # La prima esecuzione richiede qualche minuto: fino ad allora la root
    # risponde 502.
    command:
      - sh
      - -c
      - ./node_modules/.bin/next build && exec ./node_modules/.bin/next start --hostname 0.0.0.0 --port 3000

  backoffice:
    # Una SPA: si compila e basta, non serve nessun processo in ascolto. Il
    # container esegue la build in ../fipav-backoffice/build (bind mount) e
    # termina; da li' i file li serve il gateway.
    command: ["./node_modules/.bin/vite", "build"]
    restart: "no"

  # ─── Porte dei servizi: chiuse ───────────────────────────────────
  #
  # Restano raggiungibili dai container sulla rete fipav-network, ma non
  # dall'esterno della macchina.
  #
  # Il tag `!reset` e' necessario e non decorativo: Compose fa il merge delle
  # liste per concatenazione, quindi un `ports: []` normale lascerebbe intatte
  # le porte del file base. Richiede Compose >= 2.24.
  #
  # Per raggiungerle in debug si usa un tunnel SSH sulla macchina, non una porta
  # pubblicata.
  mariadb:
    ports: !reset []

  redis:
    ports: !reset []

  # Mailpit e' configurato per accettare qualunque autenticazione SMTP
  # (MP_SMTP_AUTH_ACCEPT_ANY) e connessioni non cifrate: va bene per lo
  # sviluppo, sarebbe un relay aperto se raggiungibile da fuori.
  mailpit:
    ports: !reset []

  # NOTA: MEILI_ENV resta `development` e la master key resta quella del file
  # base. Passare a `production` richiede una chiave di almeno 16 byte, quindi
  # e' una modifica che va fatta insieme e non di sfuggita qui. Per ora la
  # protezione e' che la porta non e' pubblicata.
  meilisearch:
    ports: !reset []

  gateway:
    environment:
      # Serve /backoffice/ dai file statici invece che dal dev server.
      BACKOFFICE_HANDLER: /etc/caddy/backoffice-prod.conf
    volumes:
      - ../fipav-backoffice/build:/srv/backoffice:ro
    depends_on:
      # Il gateway parte quando la build e' finita, non prima: altrimenti la
      # prima richiesta a /backoffice/ troverebbe la directory vuota e Caddy
      # servirebbe un 404 che sembra un errore di configurazione.
      backoffice:
        condition: service_completed_successfully

  # L'accesso legacy a fipav-core con l'API sulla root. Il servizio deve restare
  # in piedi: comter lo chiama da dentro la rete Docker
  # (COMTER_API_BASE_URL=http://fipav-nginx/...). Ma la porta non va pubblicata,
  # o su una macchina pubblica esisterebbe un secondo ingresso all'API, in
  # chiaro e senza passare dal gateway.
  nginx:
    ports: !reset []
