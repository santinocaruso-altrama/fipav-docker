#   http://calabria.localhost   -> fipav-comter-frontend
#   http://localhost/core       -> fipav-core
#   http://localhost/backoffice -> fipav-backoffice

name: fipavonline

services:
  # ─── Gateway: l'unico ingresso HTTP/HTTPS ────────────────────────
  gateway:
    image: caddy:alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../fipav-core/src:/var/www/html:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TZ: Europe/Rome
      ACME_CA: "${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
      HORIZON_BASIC_AUTH_USER: "${HORIZON_BASIC_AUTH_USER:-dev}"
      HORIZON_BASIC_AUTH_HASH: "${HORIZON_BASIC_AUTH_HASH:-$$2a$$14$$YEXcKLvdfMi/qhvCLpdECe2hvamqmVCBOi1gdIyfD7UHX4l2wzBFK}"
    depends_on:
      - php
      - backoffice
      - comter
    networks:
      - fipav-network

  # ─── fipav-core: Laravel ─────────────────────────────────────────
  # Nessun `build:` qui: il context/dockerfile differiscono per ambiente
  # (docker/php/dev o docker/php/stage - solo Xdebug cambia fra i due, vedi
  # i due Dockerfile), quindi vive negli overlay.
  php:
    user: www-data
    volumes:
      - ../fipav-core/src:/var/www/html
    environment:
      TZ: Europe/Rome
      APP_URL: "${CORE_APP_URL:-http://localhost/core}"
      ASSET_URL: "${CORE_ASSET_URL:-/core}"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - fipav-network

  horizon:
    command: php artisan horizon
    restart: unless-stopped
    user: www-data
    volumes:
      - ../fipav-core/src:/var/www/html
    environment:
      TZ: Europe/Rome
      APP_URL: "${CORE_APP_URL:-http://localhost/core}"
      ASSET_URL: "${CORE_ASSET_URL:-/core}"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fipav-network

  # ─── fipav-backoffice: Vite + React ──────────────────────────────
  # Nessun `build:`/`volumes:` qui: in dev e' bind mount + dev server, in
  # stage e' un build multi-stage che produce solo asset statici - troppo
  # diversi per un valore condiviso, vivono interamente negli overlay.
  backoffice:
    environment:
      TZ: Europe/Rome
      DOCKER_DEV: "true"
      VITE_API_BASE_URL: "${BACKOFFICE_API_BASE_URL:-http://localhost/core}"
      VITE_HMR_CLIENT_PORT: "${GATEWAY_PORT:-80}"
    networks:
      - fipav-network

  # ─── fipav-comter-frontend: Next.js ──────────────────────────────
  # `build:` negli overlay come per backoffice, ma `expose` resta qui: a
  # differenza di backoffice, comter e' un server persistente in ENTRAMBI
  # gli ambienti (in stage gia' pronto da un'immagine, non piu' costruito a
  # runtime - vedi docker/comter/stage/Dockerfile), quindi lo espone sempre.
  comter:
    environment:
      TZ: Europe/Rome
      DOCKER_DEV: "true"
      # apiFetch() manda il tenant nell'header x-tenant (vedi
      # fipav-comter-frontend/src/lib/api.ts), non nell'hostname: un solo
      # endpoint fisso basta per tutti i comitati - ne' per comitato, ne'
      # diverso fra locale e staging. "gateway" e' il nome del SERVIZIO
      # Compose. Porta 8081: l'endpoint interno dedicato del gateway (mai
      # pubblicata), non la 80/443 pubbliche - vedi il blocco
      # "http://gateway:8081" nei due Caddyfile.
      API_BASE_URL: "${COMTER_API_BASE_URL:-http://gateway:8081/core/api/v1/public/cms}"
      NEXT_PUBLIC_ROOT_DOMAIN: "${COMTER_ROOT_DOMAIN:-localhost}"
      NEXT_TELEMETRY_DISABLED: "1"
      # Letto a runtime da sentry.server.config.ts/sentry.edge.config.ts.
      # Lato client il DSN va invece iniettato a BUILD time (vedi
      # docker-compose.stage.yml build.args + docker/comter/stage/Dockerfile):
      # questa riga da sola non basta per il bundle browser.
      NEXT_PUBLIC_SENTRY_DSN: "${COMTER_SENTRY_DSN:-}"
    expose:
      - "3000"
    networks:
      - fipav-network

  # ─── Infrastruttura condivisa ────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    environment:
      TZ: Europe/Rome
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      # Cambiarli qui NON ruota le credenziali su un volume gia' esistente
      # (il caso normale in staging): init.sh, che li usa per le GRANT, gira
      # solo alla creazione del volume. Su un volume esistente serve un
      # ALTER USER a mano - vedi .env.example.
      MARIADB_USER: "${MARIADB_USER:-fipav}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-fipav}"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # --local-infile=0: disattiva LOAD DATA LOCAL lato server. Nessun path
    # applicativo lo usa (verificato), quindi e' solo una superficie di
    # attacco in meno se mai una query venisse costruita con input utente.
    command: --sql-mode=NO_AUTO_VALUE_ON_ZERO --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci --local-infile=0
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - fipav-network

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: Europe/Rome
    volumes:
      - redis-data:/data
    networks:
      - fipav-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web UI: http://localhost:8025
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (esposto anche sull'host, opzionale)
    environment:
      TZ: Europe/Rome
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - fipav-network

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      TZ: Europe/Rome
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - fipav-network

# Nessun `name:` qui: vive negli overlay (docker-compose.dev.yml,
# docker-compose.stage.yml), suffissato -dev/-stage come i container_name.
# ATTENZIONE mariadb-data/meilisearch-data/redis-data: prima erano pinnati a
# fipav-core_* per riusare il DB reale del compose standalone di fipav-core
# (camp2013). Con il suffisso, Docker non li trova piu' e ne crea di nuovi
# VUOTI - scelta deliberata, non un effetto collaterale. Su un volume gia'
# esistente serve un `make db-restore` (o equivalente) per ripopolarlo.
volumes:
  mariadb-data:
  meilisearch-data:
  redis-data:
  backoffice-node-modules:
  comter-node-modules:
  # Certificati e account ACME di Caddy. Da non cancellare: perderli significa
  # riemettere tutti i certificati al riavvio successivo.
  caddy-data:
  caddy-config:

networks:
  fipav-network:
    name: fipav-network
    driver: bridge
