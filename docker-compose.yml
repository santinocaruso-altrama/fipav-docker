# Orchestratore unico dell'ecosistema FIPAV Online (ambiente di sviluppo).
#
#   http://localhost/            -> fipav-comter-frontend
#   http://localhost/core/       -> fipav-core
#   http://localhost/backoffice/ -> fipav-backoffice
#   http://localhost:8080/       -> fipav-core (accesso legacy, compatibilita')
#
# Va eseguito da questa directory e assume i tre progetti come sibling:
#
#   fipavonline/
#     fipav-docker/
#     fipav-core/
#     fipav-backoffice/
#     fipav-comter-frontend/
#
# ATTENZIONE: non avviare questo compose insieme a fipav-core/docker-compose.yml.

name: fipavonline

services:
  # ─── Gateway: l'unico ingresso HTTP/HTTPS ────────────────────────
  gateway:
    image: caddy:alpine
    container_name: fipav-gateway-dev
    ports:
      - "${GATEWAY_PORT:-80}:80"
      # GATEWAY_SITES=http:// Caddy non ascolta in TLS. Averla sempre qui evita
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../fipav-core/src:/var/www/html:ro
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/gateway/backoffice-dev.conf:/etc/caddy/backoffice-dev.conf:ro
      - ./docker/gateway/backoffice-prod.conf:/etc/caddy/backoffice-prod.conf:ro
      # Certificati e chiavi dell'account ACME. Volume OBBLIGATORIO
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TZ: Europe/Rome
      GATEWAY_SITES: "${GATEWAY_SITES:-http://}"
      ACME_CA: "${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
      # Basic Auth per /core/horizon (vedi Caddyfile)
      HORIZON_BASIC_AUTH_USER: "${HORIZON_BASIC_AUTH_USER:-dev}"
      HORIZON_BASIC_AUTH_HASH: "${HORIZON_BASIC_AUTH_HASH:-$$2a$$14$$YEXcKLvdfMi/qhvCLpdECe2hvamqmVCBOi1gdIyfD7UHX4l2wzBFK}"
    depends_on:
      - php
      - backoffice
      - comter
    networks:
      - fipav-network

  # ─── fipav-core: Laravel ─────────────────────────────────────────
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fipav-php
    user: www-data
    volumes:
      - ../fipav-core/src:/var/www/html
    environment:
      TZ: Europe/Rome
      APP_URL: "${CORE_APP_URL:-http://localhost/core}"
      ASSET_URL: "${CORE_ASSET_URL:-/core}"
      # Le origini da cui il backoffice puo' autenticarsi con la sessione.
      # Va imposta qui e non lasciata al .env di fipav-core, che vale
      # localhost:3000: quello e' `npm run dev` fuori da Docker, mentre qui il
      # backoffice lo serve il gateway su localhost. Se l'origine non e' in
      # elenco Sanctum non applica StartSession, e AuthController::login
      # chiama $request->session()->regenerate() DOPO aver validato le
      # credenziali: il login riesce e poi risponde 500 "Session store not set
      # on request.". Il sintomo non nomina il dominio e arriva a credenziali
      # corrette, quindi non fa pensare a un problema di origine.
      SANCTUM_STATEFUL_DOMAINS: "${CORE_STATEFUL_DOMAINS:-localhost,*.localhost,localhost:3000,127.0.0.1,127.0.0.1:8000,::1}"
      XDEBUG_MODE: "${XDEBUG_MODE:-debug}"
      XDEBUG_CONFIG: client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - fipav-network

  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fipav-horizon
    command: php artisan horizon
    restart: unless-stopped
    user: www-data
    volumes:
      - ../fipav-core/src:/var/www/html
    environment:
      TZ: Europe/Rome
      APP_URL: "${CORE_APP_URL:-http://localhost/core}"
      ASSET_URL: "${CORE_ASSET_URL:-/core}"
      XDEBUG_MODE: "off"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fipav-network

  nginx:
    image: nginx:alpine
    container_name: fipav-nginx
    ports:
      - "${CORE_LEGACY_PORT:-8080}:80"
    volumes:
      - ../fipav-core/src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Europe/Rome
    depends_on:
      - php
    networks:
      - fipav-network

  # ─── fipav-backoffice: Vite + React ──────────────────────────────
  backoffice:
    build:
      context: ./docker/backoffice
      dockerfile: Dockerfile
    container_name: fipav-backoffice-dev
    volumes:
      - ../fipav-backoffice:/app
      - backoffice-node-modules:/app/node_modules
    environment:
      TZ: Europe/Rome
      DOCKER_DEV: "true"
      # Vince sul .env del progetto
      VITE_API_BASE_URL: "${BACKOFFICE_API_BASE_URL:-http://localhost/core}"
      # Il client HMR deve puntare alla porta del gateway, non alla 3000 interna del container.
      VITE_HMR_CLIENT_PORT: "${GATEWAY_PORT:-80}"
    expose:
      - "3000"
    networks:
      - fipav-network

  # ─── fipav-comter-frontend: Next.js ──────────────────────────────
  comter:
    build:
      context: ./docker/comter
      dockerfile: Dockerfile
    container_name: fipav-comter-dev
    volumes:
      - ../fipav-comter-frontend:/app
      - comter-node-modules:/app/node_modules
    environment:
      TZ: Europe/Rome
      DOCKER_DEV: "true"
      API_BASE_URL: "${COMTER_API_BASE_URL:-http://fipav-nginx/api/v1/public/cms}"
      NEXT_PUBLIC_ROOT_DOMAIN: "${COMTER_ROOT_DOMAIN:-localhost}"
      IMAGE_ALLOWED_DOMAINS: "${COMTER_IMAGE_ALLOWED_DOMAINS:-http://localhost}"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    networks:
      - fipav-network

  # ─── Infrastruttura condivisa ────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: fipav-mariadb
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    environment:
      TZ: Europe/Rome
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      MARIADB_USER: fipav
      MARIADB_PASSWORD: fipav
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --sql-mode=NO_AUTO_VALUE_ON_ZERO --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - fipav-network

  redis:
    image: redis:alpine
    container_name: fipav-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: Europe/Rome
    volumes:
      - redis-data:/data
    networks:
      - fipav-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: fipav-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web UI: http://localhost:8025
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (esposto anche sull'host, opzionale)
    environment:
      TZ: Europe/Rome
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - fipav-network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: fipav-meilisearch
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      TZ: Europe/Rome
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
      MEILI_UPGRADE_DB: "true"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - fipav-network

volumes:  
  mariadb-data:
    name: fipav-core_mariadb-data
  meilisearch-data:
    name: fipav-core_meilisearch-data
  redis-data:
    name: fipav-core_redis-data
  backoffice-node-modules:
  comter-node-modules:
  # Certificati e account ACME di Caddy.
  caddy-data:
  caddy-config:

networks:
  fipav-network:
    name: fipav-network
    driver: bridge