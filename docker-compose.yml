# Orchestratore unico dell'ecosistema FIPAV Online (ambiente di sviluppo).
#
#   http://localhost/            -> fipav-comter-frontend
#   http://localhost/core/       -> fipav-core
#   http://localhost/backoffice/ -> fipav-backoffice
#   http://localhost:8080/       -> fipav-core (accesso legacy, compatibilita')
#
# Va eseguito da questa directory e assume i tre progetti come sibling:
#
#   fipavonline/
#     fipav-docker/            <- qui
#     fipav-core/
#     fipav-backoffice/
#     fipav-comter-frontend/
#
# ATTENZIONE: non avviare questo compose insieme a fipav-core/docker-compose.yml.
# I container_name sono volutamente identici (per non rompere
# `docker exec fipav-php php artisan ...`), quindi i due stack sono mutuamente
# esclusivi. Questo e' l'entrypoint di riferimento.

name: fipavonline

services:
  # ─── Gateway: l'unico ingresso HTTP/HTTPS ────────────────────────
  gateway:
    image: caddy:alpine
    container_name: fipav-gateway-dev
    ports:
      - "${GATEWAY_PORT:-80}:80"
      # Pubblicata anche in locale, dove resta inutilizzata: con
      # GATEWAY_SITES=http:// Caddy non ascolta in TLS. Averla sempre qui evita
      # un file di override che esisterebbe solo per aggiungere una porta.
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../fipav-core/src:/var/www/html:ro
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      # I due modi di servire /backoffice/: proxy al dev server (default) o file
      # statici della build (staging). Il Caddyfile ne importa uno in base a
      # BACKOFFICE_HANDLER. Montati entrambi sempre, cosi' l'overlay cambia solo
      # una variabile.
      - ./docker/gateway/backoffice-dev.conf:/etc/caddy/backoffice-dev.conf:ro
      - ./docker/gateway/backoffice-prod.conf:/etc/caddy/backoffice-prod.conf:ro
      # Certificati e chiavi dell'account ACME. Volume OBBLIGATORIO, non
      # un'ottimizzazione: senza, ogni ricreazione del container riemette da
      # zero e consuma i rate limit di Let's Encrypt (5 certificati a settimana
      # per set di nomi).
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TZ: Europe/Rome
      # `http://` in locale, l'elenco degli hostname in staging. E' l'unica
      # differenza fra i due ambienti: da un elenco di nomi pubblici Caddy
      # ricava da se' che deve emettere i certificati e reindirizzare a https.
      GATEWAY_SITES: "${GATEWAY_SITES:-http://}"
      ACME_CA: "${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
      # Basic Auth per /core/horizon (vedi Caddyfile). Non un blocco per IP:
      # questo host gira Docker rootless, il client reale non arriva mai a
      # Caddy (vedi commento nel Caddyfile). Default dev/dev in locale, cosi'
      # uno sviluppatore apre /horizon senza configurare nulla; in staging va
      # sempre sovrascritto nel .env della macchina. L'hash e' bcrypt (`docker
      # compose exec gateway caddy hash-password --plaintext 'la-password'`),
      # mai la password in chiaro. I `$` vanno raddoppiati qui perche' Compose
      # userebbe altrimenti `$2a` ecc. come proprie variabili da interpolare.
      HORIZON_BASIC_AUTH_USER: "${HORIZON_BASIC_AUTH_USER:-dev}"
      HORIZON_BASIC_AUTH_HASH: "${HORIZON_BASIC_AUTH_HASH:-$$2a$$14$$YEXcKLvdfMi/qhvCLpdECe2hvamqmVCBOi1gdIyfD7UHX4l2wzBFK}"
    depends_on:
      - php
      - backoffice
      - comter
    networks:
      - fipav-network

  # ─── fipav-core: Laravel ─────────────────────────────────────────
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fipav-php
    # Senza questo, il container (e ogni `docker compose exec php ...` lanciato
    # a mano: composer, artisan) gira come root di default - solo i worker che
    # servono le richieste HTTP vere girano come www-data (da www.conf). I file
    # scritti da un comando manuale finiscono root-owned, e www-data non puo'
    # piu' riscriverli: e' cosi' che storage/framework/views si e' rotto in
    # staging (tempnam(): file created in the system's temporary directory,
    # ogni vista mai compilata prima falliva). Con `user: www-data` qui, tutto
    # cio' che tocca questo container - server o comando manuale - scrive
    # sempre con lo stesso utente, quindi il problema non si ripresenta.
    user: www-data
    volumes:
      - ../fipav-core/src:/var/www/html
    environment:
      TZ: Europe/Rome
      APP_URL: "${CORE_APP_URL:-http://localhost/core}"
      # Prefisso degli asset emessi da asset() (immagini delle discipline).
      # Un percorso e non un URL: le immagini escono come /core/images/...,
      # relative alla root e senza hostname, quindi il valore resta lo stesso
      # in locale, staging e produzione.
      # Indispensabile perche' comter chiama l'API server-side su
      # http://fipav-nginx: senza questa, gli URL delle immagini uscirebbero
      # con quell'hostname, che il browser non risolve. Vedi config/app.php.
      ASSET_URL: "${CORE_ASSET_URL:-/core}"
      XDEBUG_MODE: "${XDEBUG_MODE:-debug}"
      XDEBUG_CONFIG: client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - fipav-network

  # Worker delle code (QUEUE_CONNECTION=redis). Senza questo servizio nessun
  # processo consuma le code: i job restano accodati su Redis all'infinito,
  # in silenzio (nessun errore, nessun log - si scopre solo controllando
  # Redis a mano). Stessa immagine di `php`: Horizon e' un comando Artisan,
  # non serve un'immagine diversa, solo un CMD diverso.
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: fipav-horizon
    command: php artisan horizon
    restart: unless-stopped
    # Stesso motivo del servizio `php`: gira sempre come www-data, coerente
    # con chi possiede storage/ e bootstrap/cache dopo il fix dei permessi.
    user: www-data
    volumes:
      - ../fipav-core/src:/var/www/html
    environment:
      TZ: Europe/Rome
      APP_URL: "${CORE_APP_URL:-http://localhost/core}"
      ASSET_URL: "${CORE_ASSET_URL:-/core}"
      # Un worker in background non serve mai un IDE in ascolto: a differenza
      # di `php` qui non c'e' override per XDEBUG_MODE, resta sempre off.
      XDEBUG_MODE: "off"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fipav-network

  nginx:
    image: nginx:alpine
    container_name: fipav-nginx
    ports:
      - "${CORE_LEGACY_PORT:-8080}:80"
    volumes:
      - ../fipav-core/src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Europe/Rome
    depends_on:
      - php
    networks:
      - fipav-network

  # ─── fipav-backoffice: Vite + React ──────────────────────────────
  backoffice:
    build:
      context: ./docker/backoffice
      dockerfile: Dockerfile
    container_name: fipav-backoffice-dev
    volumes:
      - ../fipav-backoffice:/app
      # Maschera i node_modules dell'host (binari darwin-arm64). Popolato
      # dall'entrypoint al primo avvio.
      - backoffice-node-modules:/app/node_modules
    environment:
      TZ: Europe/Rome
      DOCKER_DEV: "true"
      # Vince sul .env del progetto (Vite dà priorità alle variabili reali
      # rispetto ai file .env), quindi il dev locale su :3000 resta invariato.
      # Same-origin rispetto al gateway: nessun CORS da configurare.
      VITE_API_BASE_URL: "${BACKOFFICE_API_BASE_URL:-http://localhost/core}"
      # Il client HMR deve puntare alla porta del gateway, non alla 3000
      # interna del container.
      VITE_HMR_CLIENT_PORT: "${GATEWAY_PORT:-80}"
    # Nessuna porta esposta sull'host: si raggiunge solo dal gateway. Cosi' la
    # 3000 resta libera per `npm run dev` sul Mac.
    expose:
      - "3000"
    networks:
      - fipav-network

  # ─── fipav-comter-frontend: Next.js ──────────────────────────────
  comter:
    build:
      context: ./docker/comter
      dockerfile: Dockerfile
    container_name: fipav-comter-dev
    volumes:
      - ../fipav-comter-frontend:/app
      - comter-node-modules:/app/node_modules
    environment:
      TZ: Europe/Rome
      DOCKER_DEV: "true"
      API_BASE_URL: "${COMTER_API_BASE_URL:-http://fipav-nginx/api/v1/public/cms}"
      NEXT_PUBLIC_ROOT_DOMAIN: "${COMTER_ROOT_DOMAIN:-localhost}"
      IMAGE_ALLOWED_DOMAINS: "${COMTER_IMAGE_ALLOWED_DOMAINS:-http://localhost}"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    networks:
      - fipav-network

  # ─── Infrastruttura condivisa ────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: fipav-mariadb
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    environment:
      TZ: Europe/Rome
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      MARIADB_USER: fipav
      MARIADB_PASSWORD: fipav
    volumes:
      - mariadb-data:/var/lib/mysql
      # Eseguito solo alla creazione del volume: con il volume già popolato
      # docker-entrypoint-initdb.d viene ignorato, quindi nessun rischio di
      # sovrascrivere i dati esistenti.
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --sql-mode=NO_AUTO_VALUE_ON_ZERO --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci
    healthcheck:
      # Evita che php parta prima che il DB accetti connessioni.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - fipav-network

  # AOF (fsync ogni secondo): senza, un riavvio del container perde tutti i
  # job in coda (export Excel accodati ma non ancora processati) perche' redis
  # di default tiene tutto solo in RAM. `--appendonly yes` scrive ogni comando
  # sul volume `redis-data`, da cui redis si ricarica all'avvio.
  redis:
    image: redis:alpine
    container_name: fipav-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: Europe/Rome
    volumes:
      - redis-data:/data
    networks:
      - fipav-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: fipav-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web UI: http://localhost:8025
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (esposto anche sull'host, opzionale)
    environment:
      TZ: Europe/Rome
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - fipav-network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: fipav-meilisearch
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      TZ: Europe/Rome
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - fipav-network

volumes:
  # Nomi pinnati a quelli creati dal compose di fipav-core. Senza `name:`, il
  # project name diverso genererebbe volumi nuovi e VUOTI: si perderebbe
  # l'accesso al database camp2013 di lavoro. Con `name:` esplicito il volume
  # viene riusato se esiste e creato se manca.
  mariadb-data:
    name: fipav-core_mariadb-data
  meilisearch-data:
    name: fipav-core_meilisearch-data
  redis-data:
    name: fipav-core_redis-data
  backoffice-node-modules:
  comter-node-modules:
  # Certificati e account ACME di Caddy. Da non cancellare: perderli significa
  # riemettere tutti i certificati al riavvio successivo.
  caddy-data:
  caddy-config:

networks:
  fipav-network:
    name: fipav-network
    driver: bridge